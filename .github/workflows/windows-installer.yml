name: Windows Installers

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-windows-x64:
    name: Windows 64-bit
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build Windows x64
        run: npx electron-builder@26.15.3 --win nsis --x64 --publish never

      - name: Upload x64 installer
        uses: actions/upload-artifact@v4
        with:
          name: Clinic-Windows-x64
          path: release/*.exe

  build-windows-ia32:
    name: Windows 32-bit
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build Windows 32-bit
        run: npx electron-builder@26.15.3 --win nsis --ia32 --publish never

      - name: Upload 32-bit installer
        uses: actions/upload-artifact@v4
        with:
          name: Clinic-Windows-32bit
          path: release/*.exe
